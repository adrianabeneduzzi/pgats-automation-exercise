
name: PGATS - Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cypress:
    name: Executar testes do trabalho final
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Executar testes Cypress
        run: npm test

      - name: Publicar relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-evidencias-cypress
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn
          retention-days: 14
